# Builds the Python bindings and runs their tests, on the oldest and a recent
# supported Python.
name: python

on:
  push:
    paths: ["bindings/python/**", "crates/tkone-schedule/src/**", "crates/tkone-calendar/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["bindings/python/**", "crates/tkone-schedule/src/**", "crates/tkone-calendar/**", ".github/workflows/python.yml"]

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest ./bindings/python
      - run: python -m pytest -q bindings/python/tests
