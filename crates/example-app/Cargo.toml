[package]
name             = "example-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish          = false

# Use cases that combine the crates. Each crate's own API examples are in
# its examples/ directory; see the root README.

[[bin]]
name = "loan-repayments"
path = "src/calendar/loan_repayments.rs"

[[bin]]
name = "exchange-jobs"
path = "src/calendar/exchange_jobs.rs"

[[bin]]
name = "payroll"
path = "src/calendar/payroll.rs"

[[bin]]
name = "store-deliveries"
path = "src/calendar/store_deliveries.rs"

[dependencies]
tkone-schedule       = { workspace = true }
tkone-calendar       = { workspace = true }
fallible-iterator    = { workspace = true }
chrono               = { workspace = true }

[lints]
workspace = true
