# Builds and tests the Rust workspace, with default and with all features,
# keeps clippy and rustdoc free of warnings, and checks the formatting.
name: rust

on:
  push:
    paths: ["crates/**", "bindings/**", "Cargo.toml", "Cargo.lock", "rustfmt.toml", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["crates/**", "bindings/**", "Cargo.toml", "Cargo.lock", "rustfmt.toml", ".github/workflows/rust.yml"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Tests (${{ matrix.features.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - { name: default features, flags: "" }
          - { name: all features, flags: "--all-features" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace ${{ matrix.features.flags }}

  lint:
    name: Formatting, clippy and rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      # The bindings are outside the workspace.
      - run: cargo fmt --check
        working-directory: bindings/python
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
