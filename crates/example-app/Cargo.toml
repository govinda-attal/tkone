[package]
name             = "example-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish          = false

[[bin]]
name = "trigger-imperative"
path = "src/trigger/imperative.rs"

[[bin]]
name = "trigger-declarative"
path = "src/trigger/declarative.rs"

# Use cases: schedules on real holiday calendars.
[[bin]]
name = "loan-repayments"
path = "src/calendar/loan_repayments.rs"

[[bin]]
name = "exchange-jobs"
path = "src/calendar/exchange_jobs.rs"

[[bin]]
name = "payroll"
path = "src/calendar/payroll.rs"

[[bin]]
name = "store-deliveries"
path = "src/calendar/store_deliveries.rs"

[dependencies]
tkone-schedule       = { workspace = true }
tkone-calendar       = { workspace = true }
fallible-iterator    = { workspace = true }
tkone-trigger        = { workspace = true }
tkone-trigger-macros = { workspace = true }
chrono               = { workspace = true }
thiserror            = { workspace = true }
tokio                = { workspace = true }

[lints]
workspace = true
